plugins { id 'com.android.application' }
android {
 namespace 'com.poligon.local'; compileSdk 35
 defaultConfig { applicationId 'com.poligon.local'; minSdk 28; targetSdk 35; versionCode 20000; versionName '2.0.0'; ndk { abiFilters 'arm64-v8a' } }
 buildFeatures { buildConfig true }
 signingConfigs { release { if (System.getenv('POLIGON_KEYSTORE')) { storeFile file(System.getenv('POLIGON_KEYSTORE')); storePassword System.getenv('POLIGON_STORE_PASSWORD'); keyAlias 'poligon'; keyPassword System.getenv('POLIGON_KEY_PASSWORD') } } }
 buildTypes { debug { if (System.getenv('POLIGON_KEYSTORE')) signingConfig signingConfigs.release }; release { minifyEnabled false; if (System.getenv('POLIGON_KEYSTORE')) signingConfig signingConfigs.release } }
 packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
