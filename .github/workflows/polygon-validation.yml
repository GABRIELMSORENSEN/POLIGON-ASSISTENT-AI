name: Polygon validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend test dependencies
        run: python -m pip install fastapi uvicorn httpx psutil pillow qrcode python-multipart
      - name: Validate model catalog JSON
        run: python -m json.tool web/model-catalog.json > /dev/null
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
